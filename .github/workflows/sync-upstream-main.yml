# 已废弃（2026-11-02）：本仓库是 fork，GitHub 不支持在 fork 仓库上按计划触发 scheduled workflow。
#
# 现象与结论：
#   - workflow 位于默认分支 develop、state=active、cron 合法，手动 workflow_dispatch 多次成功；
#   - 但多个计划时间点（06:17/12:17/12:43 UTC）均未产生任何 schedule 运行记录，全仓库 schedule 计数为 0；
#   - 已按官方建议改过 cron 试图重新注册，仍不触发；GitHub Copilot 确认根因是 fork 仓库不支持定时任务。
#
# 处置：
#   - 已移除 schedule 触发器，避免留下一个永不生效、又可能误以为仍在同步的定时配置；
#   - 上流 main 的定时同步改由仓库外的替代方案完成；
#   - 本文件、tools/sync-upstream-main.mjs 与相关测试保留，仅用于手动触发（workflow_dispatch）与回归验证。
#   - 若将来本仓库不再是 fork（例如迁移为独立仓库），可恢复下方 schedule 配置：
#       schedule:
#         - cron: '43 */6 * * *'   # UTC，对应北京时间 02:43/08:43/14:43/20:43

name: Sync upstream main

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只预演，不更新 GitHub main'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: upstream-main-sync
  cancel-in-progress: false

jobs:
  validate:
    name: Validate synchronization context
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Reject unsupported repository, branch, or event explicitly
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY:-}" != 'marktrue-ahu/dsh-mobile-remote' ]]; then
            echo '::error::Sync is only supported in marktrue-ahu/dsh-mobile-remote.'
            exit 1
          fi
          if [[ "${GITHUB_REF:-}" != 'refs/heads/develop' ]]; then
            echo '::error::Run this workflow from develop; main and other branches are not supported.'
            exit 1
          fi
          case "${GITHUB_EVENT_NAME:-}" in
            schedule|workflow_dispatch) ;;
            *) echo '::error::Only schedule and workflow_dispatch are supported.'; exit 1 ;;
          esac
          echo 'Repository, develop branch, and event verified; no API write performed.'

  preview:
    name: Preview upstream main synchronization
    needs: validate
    if: github.repository == 'marktrue-ahu/dsh-mobile-remote' && github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out automation code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Preview without write permissions or optional PAT
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/sync-upstream-main.mjs --dry-run

  sync:
    name: Fast-forward the upstream mirror
    needs: validate
    environment: upstream-sync
    if: github.repository == 'marktrue-ahu/dsh-mobile-remote' && github.ref == 'refs/heads/develop' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 只检出受信的 develop；上游仅作为 GitHub API 数据来源，不检出/执行其代码。
      - name: Check out automation code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Synchronize upstream main
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: node tools/sync-upstream-main.mjs --apply
