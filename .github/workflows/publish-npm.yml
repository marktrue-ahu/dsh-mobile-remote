name: Publish npm release

# 发布政策（issue #43 / ADR 0025 / docs/design/alpha-release-global-build.md rev.3）：
#   - alpha tag 允许在 develop；rc/stable tag 只允许在对应 core 的 release/vX.Y.Z；
#     只校验**可达性**（merge-base --is-ancestor），不声称 Git 不存在的“tag 来源分支”。
#   - 全局单调 build：权威记录是受保护分支 release-meta 的 build-policy.json；
#     本 workflow 的 `origin` 是 GitHub，因此 CI 读 `origin/release-meta`；本机分配端
#     另需校验 `github/release-meta` 完全一致（见 tools/next-build.mjs）。
#   - 已发布状态判定先于动态通道校验：两者都可见 → 只读幂等成功（旧 tag 重跑不要求
#     当前 channel 仍等于旧版本）；carrier 已发/插件未发 → 排除自身 carrier 后校验；
#     新发布 → build 必须 > 发布前沿。**不使用全量 tag 最大值**。
#   - app 指针先比较后移动（比较剥离 -app 后的配对插件版本），不得回退；
#     latest 只有 stable 可前进，prerelease 永不移动 latest。
#   - 发布请求提交前把 release 意图写入 release-meta（submitted）；可见性无法确认时
#     标记 unknown 并阻断后续发布，必须人工恢复；绝不把超时当作“确定未发布”。
#
# 需要的仓库设置（fail-closed）：
#   - 受保护分支 release-meta（内容 build-policy.json）。
#   - secret RELEASE_META_TOKEN（或允许 GitHub Actions 绕过分支保护的 github.token），
#     具备 contents:write；workflow 在未配置可写 token 时会在发布前失败。
#   - environment npm-publish 的签名 secret 与 ANDROID_CERT_SHA256 保持原样。
#   - 可选 vars.RELEASE_META_SECONDARY_REMOTE_URL：配置第二个 release-meta 远端 URL
#     （如 GitLab 镜像）时，workflow 会 `git remote add` 并校验双远端 release-meta
#     SHA 与内容逐字节一致；未配置时 CI 只以 origin（GitHub）为权威（本机分配端
#     tools/next-build.mjs 始终校验 origin+github 双远端）。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  # 全局串行：多个 release tag 同时发布时会互相抢 app / channel dist-tag。
  group: npm-publish
  cancel-in-progress: false

env:
  REGISTRY: https://registry.npmjs.org/

jobs:
  publish:
    name: Build, verify, and publish npm packages
    runs-on: ubuntu-24.04
    environment: npm-publish
    timeout-minutes: 120

    steps:
      - name: Check out tagged release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false

      # npm dist-tag OIDC support requires npm >= 11.21.0. No NPM_TOKEN is used.
      - name: Pin npm CLI
        run: npm install --global npm@11.21.0 --registry https://registry.npmjs.org/

      - name: Resolve release tag kind and version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE:-}" == "tag" ]] || {
            echo '::error::release-tag-required: this workflow only publishes version tags.'
            exit 1
          }
          tag="$GITHUB_REF_NAME"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { pluginPublishTag } from "./dsh-mobile-app/tools/lib/release-checks.mjs";
            import { parseReleaseTag } from "./tools/lib/release-policy.mjs";
            const pkg = JSON.parse(readFileSync("./package.json", "utf8"));
            if (typeof pkg.name !== "string" || pkg.name === "") {
              console.error("::error::package-name-missing: package.json 缺少 name");
              process.exit(1);
            }
            const tag = process.argv[1];
            const parsed = parseReleaseTag(tag);
            if (parsed === null) {
              console.error(`::error::tag-version-invalid: ${tag}`);
              process.exit(1);
            }
            if (parsed.kind === "prerelease-other") {
              console.error(`::error::tag-kind-unsupported: ${tag}（只支持 alpha/rc/stable）`);
              process.exit(1);
            }
            const pluginTag = pluginPublishTag(parsed.pluginVersion);
            if (!pluginTag) {
              console.error(`::error::plugin-dist-tag-invalid: ${parsed.pluginVersion}`);
              process.exit(1);
            }
            writeFileSync(process.env.GITHUB_ENV, [
              `PACKAGE_NAME=${pkg.name}`,
              `TAG_KIND=${parsed.kind}`,
              `CORE_VERSION=${parsed.core}`,
              `PLUGIN_VERSION=${parsed.pluginVersion}`,
              `PLUGIN_TAG=${pluginTag}`,
            ].join("\n") + "\n", { flag: "a" });
            console.log(`tag=${tag} kind=${parsed.kind} core=${parsed.core} plugin=${parsed.pluginVersion} channel=${pluginTag}`);
          ' "$tag"

      - name: Validate tag and version pairing
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { exactCarrierAliasChecks } from "./dsh-mobile-app/tools/lib/release-checks.mjs";
            import { isPluginVersion, parseAppVersion } from "./tools/lib/release-policy.mjs";

            const pluginVersion = process.env.PLUGIN_VERSION;
            const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (tagVersion !== pluginVersion) {
              console.error(`::error::tag-version-mismatch: tag=${tagVersion} package.json=${pluginVersion}`);
              process.exit(1);
            }
            if (!isPluginVersion(pluginVersion)) {
              console.error(`::error::plugin-version-invalid: ${pluginVersion}`);
              process.exit(1);
            }
            const pkg = JSON.parse(readFileSync("./package.json", "utf8"));
            const appLine = /^version:[ \t]*([0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)[ \t]*$/m.exec(
              readFileSync("./dsh-mobile-app/pubspec.yaml", "utf8"),
            );
            if (appLine === null) {
              console.error("::error::pubspec-version-invalid: pubspec.yaml 需要 X.Y.Z+N");
              process.exit(1);
            }
            const app = parseAppVersion(appLine[1]);
            const core = pluginVersion.split("-")[0];
            if (app === null || app.build === null) {
              console.error(`::error::app-version-invalid: ${appLine[1]}`);
              process.exit(1);
            }
            if (app.version !== core) {
              console.error(`::error::app-core-mismatch: App ${app.version} 必须使用插件 core ${core}`);
              process.exit(1);
            }
            const failed = exactCarrierAliasChecks(pkg).filter((check) => !check.pass);
            for (const check of failed) {
              console.error(`::error::exact-carrier-alias-check-failed: ${check.name} (${check.detail})`);
            }
            if (failed.length > 0) process.exit(1);
            const { appendFileSync } = await import("node:fs");
            appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${app.version}+${app.build}\nBUILD=${app.build}\n`);
            console.log(`identity OK: plugin=${pluginVersion} app=${app.version}+${app.build} carrier=${pluginVersion}-app`);
          '

      - name: Enforce tag ancestry (alpha → develop, rc/stable → release/vX.Y.Z)
        shell: bash
        run: |
          set -euo pipefail
          case "${TAG_KIND}" in
            alpha)
              git fetch origin '+refs/heads/develop:refs/remotes/origin/develop' --no-tags
              git rev-parse --verify --quiet refs/remotes/origin/develop >/dev/null || {
                echo '::error::branch-ancestry-missing: origin/develop 不存在'
                exit 1
              }
              if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/develop; then
                echo '::error::branch-ancestry-mismatch: alpha tag 提交必须可达于 origin/develop（先推 develop 再推 tag）'
                exit 1
              fi
              echo "alpha tag reachability OK: $GITHUB_SHA is an ancestor of origin/develop"
              ;;
            rc|stable)
              branch="release/v${CORE_VERSION}"
              git fetch origin '+refs/heads/release/*:refs/remotes/origin/release/*' --no-tags
              if ! git rev-parse --verify --quiet "refs/remotes/origin/${branch}" >/dev/null; then
                echo "::error::release-branch-missing: rc/stable tag 需要对应 core 的 origin/${branch}"
                exit 1
              fi
              if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/${branch}"; then
                echo "::error::branch-ancestry-mismatch: tag 提交必须可达于 origin/${branch}"
                exit 1
              fi
              # release 分支 core 必须等于 tag core（refspec 已按精确分支拉取；这里再断言一次）。
              releasePackageVersion="$(git show "refs/remotes/origin/${branch}:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s).version; process.stdout.write(String(v).split("-")[0]);});')"
              if [[ "$releasePackageVersion" != "$CORE_VERSION" ]]; then
                echo "::error::release-branch-core-mismatch: origin/${branch} core=${releasePackageVersion} tag core=${CORE_VERSION}"
                exit 1
              fi
              echo "${TAG_KIND} tag reachability OK: $GITHUB_SHA is an ancestor of origin/${branch} (core ${CORE_VERSION})"
              ;;
            *)
              echo "::error::tag-kind-unsupported: ${TAG_KIND}"
              exit 1
              ;;
          esac

      - name: Fetch and validate release-meta authority
        shell: bash
        env:
          RELEASE_META_SECONDARY_REMOTE_URL: ${{ vars.RELEASE_META_SECONDARY_REMOTE_URL }}
        run: |
          set -euo pipefail
          # 权威来源：release-meta 分支的 build-policy.json。绝不读取 tag 工作树里的副本。
          git fetch origin '+refs/heads/release-meta:refs/remotes/origin/release-meta' --no-tags || {
            echo '::error::release-meta-missing: 受保护分支 release-meta 不存在（先执行 release-meta bootstrap 并推送）'
            exit 1
          }
          git rev-parse --verify --quiet refs/remotes/origin/release-meta >/dev/null || {
            echo '::error::release-meta-missing: origin/release-meta 不可解析'
            exit 1
          }
          git show refs/remotes/origin/release-meta:build-policy.json > "$RUNNER_TEMP/build-policy.json" || {
            echo '::error::release-meta-missing: release-meta:build-policy.json 不存在'
            exit 1
          }
          if [[ -n "${RELEASE_META_SECONDARY_REMOTE_URL:-}" ]]; then
            # m2：真正的第二远端实现（URL 由 vars.RELEASE_META_SECONDARY_REMOTE_URL 提供）。
            secondary="release-meta-secondary"
            git remote remove "$secondary" >/dev/null 2>&1 || true
            git remote add "$secondary" "$RELEASE_META_SECONDARY_REMOTE_URL"
            git fetch "$secondary" "+refs/heads/release-meta:refs/remotes/${secondary}/release-meta" --no-tags || {
              echo "::error::release-meta-missing: 第二远端 ${secondary} 的 release-meta 不可用"
              exit 1
            }
            origin_sha="$(git rev-parse refs/remotes/origin/release-meta)"
            secondary_sha="$(git rev-parse "refs/remotes/${secondary}/release-meta")"
            if [[ "$origin_sha" != "$secondary_sha" ]]; then
              echo "::error::release-meta-diverged: origin/release-meta=${origin_sha} ${secondary}/release-meta=${secondary_sha}"
              exit 1
            fi
            git show "refs/remotes/${secondary}/release-meta:build-policy.json" > "$RUNNER_TEMP/build-policy.secondary.json"
            if ! cmp -s "$RUNNER_TEMP/build-policy.json" "$RUNNER_TEMP/build-policy.secondary.json"; then
              echo "::error::release-meta-diverged: 两个 remote 的 build-policy.json 内容不一致"
              exit 1
            fi
            echo "release-meta dual-source consistency OK: origin + ${RELEASE_META_SECONDARY_REMOTE_URL}"
          else
            echo 'release-meta source: origin/release-meta only (CI origin=GitHub；本机分配端另校验 github)'
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseBuildPolicy } from "./tools/lib/release-policy.mjs";
            const parsed = parseBuildPolicy(readFileSync(process.argv[1], "utf8"));
            if (!parsed.ok) {
              for (const item of parsed.reasons) console.error(`::error::${item.code}: ${item.detail}`);
              process.exit(1);
            }
            console.log(`release-meta policy OK: watermark=${parsed.policy.watermark} legacyTags=${parsed.policy.legacyTags.length} legacyCarriers=${parsed.policy.legacyCarriers.length} intents=${parsed.policy.intents.length}`);
          ' "$RUNNER_TEMP/build-policy.json"
          echo 'RELEASE_META_SOURCE=origin/release-meta (CI origin=GitHub；分支内副本不是权威)' >> "$GITHUB_ENV"

      - name: Decide publish state, build frontier, and dist-tag movements
        shell: bash
        run: |
          set -euo pipefail
          # B1：本步骤只运行 release-gate prepare（它自行打印判定摘要）。$GITHUB_ENV 写入的
          # STATE/BUILD/... 只对**后续步骤**可见；同一 shell 里引用会因 set -u 直接失败。
          node tools/release-gate.mjs prepare \
            --tag "$GITHUB_REF_NAME" \
            --policy "$RUNNER_TEMP/build-policy.json" \
            --registry "$REGISTRY" \
            --github-env "$GITHUB_ENV"

      # failure/unknown 处理需要把状态写回 release-meta；脚本在发布前生成，只有真正要发布的
      # 会话才会用到。写操作需要可绕过 release-meta 保护分支的 token（未配置则 fail-closed）。
      - name: Write release-meta helper functions
        if: ${{ env.STATE != 'fully-published' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-meta-helpers.sh" <<'SH'
          set -euo pipefail
          RELEASE_META_WT="$RUNNER_TEMP/release-meta-wt"
          release_meta_require_token() {
            if [[ -z "${RELEASE_META_TOKEN:-}" ]]; then
              echo '::error::release-meta-write-token-missing: 未配置可写 release-meta 的 token（secret RELEASE_META_TOKEN 或允许绕过保护的 github.token）；按 fail-closed 不发布'
              exit 1
            fi
          }
          release_meta_checkout() {
            release_meta_require_token
            if [[ ! -e "$RELEASE_META_WT/.git" ]]; then
              git worktree add -B release-meta "$RELEASE_META_WT" refs/remotes/origin/release-meta
            fi
          }
          release_meta_push() {
            local action="$1"
            cd "$RELEASE_META_WT"
            if git status --porcelain -- build-policy.json | grep -q .; then
              git config user.name "dsh-release-bot"
              git config user.email "release-bot@users.noreply.github.com"
              git add build-policy.json
              git commit -m "release: ${action} ${TAG:-unknown}"
              git push "https://x-access-token:${RELEASE_META_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:release-meta
            else
              echo "release-meta unchanged (${action}); no commit"
            fi
          }
          release_meta_mark() {
            local status="$1"
            local note="${2:-}"
            release_meta_checkout
            node "$GITHUB_WORKSPACE/tools/release-gate.mjs" mark-intent \
              --policy "$RELEASE_META_WT/build-policy.json" \
              --tag "$TAG" --status "$status" --note "$note"
            release_meta_push "intent-${status}"
          }
          SH
          chmod +x "$RUNNER_TEMP/release-meta-helpers.sh"
          echo "release-meta helpers ready"

      - name: Fully-published rerun read-only verification
        if: ${{ env.STATE == 'fully-published' }}
        shell: bash
        run: |
          set -euo pipefail
          # 只读：不发布、不移动 channel/app/latest。旧 tag 重跑不得要求当前 channel 等于旧版本，
          # 但 app 指针不得被回退（verify-readonly 断言）。
          node tools/release-gate.mjs verify-readonly \
            --policy "$RUNNER_TEMP/build-policy.json" \
            --tag "$GITHUB_REF_NAME" \
            --plugin-version "$PLUGIN_VERSION" \
            --carrier-version "$CARRIER_VERSION" \
            --registry "$REGISTRY"
          echo "fully-published read-only verification PASSED for $GITHUB_REF_NAME; no publish, no dist-tag changes."
          if [[ -n "${LEFTOVER_INTENT_STATUS:-}" ]]; then
            echo "::warning::leftover-intent: tag=${TAG} status=${LEFTOVER_INTENT_STATUS}。版本已发布但发布意图未关闭；按 docs/10-release.md §10.3 用 registry integrity 执行 mark-intent --status published 并推送 release-meta（禁止重新发布）。"
          fi

      - name: Set up pnpm
        if: ${{ env.STATE != 'fully-published' }}
        uses: pnpm/action-setup@v4
        with:
          version: '11.22.0'
          run_install: false

      - name: Set up Java
        if: ${{ env.STATE != 'fully-published' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 所有版本都在 CI 现场构建签名 APK（不再复用旧载体 APK）。
      # 构建机需要 Android SDK；签名材料来自 npm-publish environment 的 secrets。
      - name: Set up Android SDK
        if: ${{ env.STATE != 'fully-published' }}
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        if: ${{ env.STATE != 'fully-published' }}
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Flutter
        if: ${{ env.STATE != 'fully-published' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      # The project has bundleDependencies (qrcode); use an npm-flat node_modules tree
      # because npm pack cannot reliably bundle from pnpm's symlinked node_modules layout.
      - name: Install root package dependencies for npm pack
        if: ${{ env.STATE != 'fully-published' }}
        run: npm install --no-save --package-lock=false --ignore-scripts --omit=optional --registry https://registry.npmjs.org/

      - name: Install Flutter dependencies
        if: ${{ env.STATE != 'fully-published' }}
        working-directory: dsh-mobile-app
        run: flutter pub get --enforce-lockfile

      - name: Cache Gradle caches
        if: ${{ env.STATE != 'fully-published' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1-${{ hashFiles('dsh-mobile-app/android/**/*.gradle*', 'dsh-mobile-app/android/**/gradle.properties', 'dsh-mobile-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-v1-

      - name: Run Node and Flutter tests in parallel
        if: ${{ env.STATE != 'fully-published' }}
        shell: bash
        run: |
          set -uo pipefail
          node_log="$RUNNER_TEMP/node-tests.log"
          flutter_log="$RUNNER_TEMP/flutter-tests.log"
          run_node_tests() {
            local gate_home
            gate_home="$(mktemp -d)"
            trap 'rm -rf "$gate_home"' EXIT
            env \
              -u DSH_PROFILE -u DSH_PROFILE_DIR -u DSH_SESSION_ID \
              -u DSH_SHELL -u DSH_WEB_URL -u DSH_WEB_FOREGROUND -u INVOCATION_ID \
              -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_SDK_HOME \
              -u NPM_TOKEN -u NODE_AUTH_TOKEN \
              -u NPM_CONFIG_USERCONFIG -u npm_config_userconfig \
              -u NPM_CONFIG_REGISTRY -u npm_config_registry \
              HOME="$gate_home" \
              DSH_HOME="$gate_home/.dsh" \
              XDG_CONFIG_HOME="$gate_home/.config" \
              XDG_CACHE_HOME="$gate_home/.cache" \
              XDG_DATA_HOME="$gate_home/.local/share" \
              npm_config_cache="$gate_home/.npm-cache" \
              node --test test/*.mjs
          }
          run_node_tests >"$node_log" 2>&1 &
          node_pid=$!
          flutter_rc=0
          (cd dsh-mobile-app && flutter analyze --no-pub --no-fatal-infos && flutter test --no-pub) >"$flutter_log" 2>&1 || flutter_rc=$?
          node_rc=0
          wait "$node_pid" || node_rc=$?
          echo '===== Node tests ====='
          cat "$node_log"
          echo '===== Flutter analysis/tests ====='
          cat "$flutter_log"
          if [[ "$node_rc" -ne 0 || "$flutter_rc" -ne 0 ]]; then
            echo "::error::test failure (node=${node_rc} flutter=${flutter_rc})"
            exit 1
          fi
          echo 'Node and Flutter tests passed in parallel.'

      # key.properties and the keystore are intentionally not committed.
      # 所有 release tag（stable 与 prerelease）都使用正式 release key 现场构建 APK；
      # 早期 debug 签名的预发布线已终止，不再复用旧载体里的 debug APK。
      - name: Configure Android signing key
        if: ${{ env.STATE != 'fully-published' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 GitHub secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set the ANDROID_KEYSTORE_PASSWORD GitHub secret}"
          : "${ANDROID_KEY_ALIAS:?Set the ANDROID_KEY_ALIAS GitHub secret}"
          : "${ANDROID_KEY_PASSWORD:?Set the ANDROID_KEY_PASSWORD GitHub secret}"
          umask 077
          mkdir -p dsh-mobile-app/android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > dsh-mobile-app/android/app/dsh-release.jks
          cat > dsh-mobile-app/android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/dsh-release.jks
          EOF

      - name: Build signed Android APK
        if: ${{ env.STATE != 'fully-published' }}
        working-directory: dsh-mobile-app
        run: flutter build apk --release --no-pub

      - name: Verify APK signing certificate
        if: ${{ env.STATE != 'fully-published' }}
        env:
          EXPECTED_ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 || secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${EXPECTED_ANDROID_CERT_SHA256:?Set ANDROID_CERT_SHA256 as an npm-publish environment variable or secret}"
          apk='dsh-mobile-app/build/app/outputs/flutter-apk/app-release.apk'
          apksigner="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          actual="$("$apksigner" verify --print-certs "$apk" 2>&1 | sed -nE 's/.*(([[:xdigit:]]{2}:){31}[[:xdigit:]]{2}|[[:xdigit:]]{64}).*/\1/p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_ANDROID_CERT_SHA256" | sed -E 's/^[[:space:]]*SHA-?256[[:space:]]*[:=][[:space:]]*//I' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::APK certificate SHA-256 mismatch (actual=${actual:-missing}, expected=${expected})."
            exit 1
          fi

      - name: Install Verdaccio for the isolated release drill
        if: ${{ env.STATE != 'fully-published' }}
        run: npm install --global verdaccio@6.10.6 --registry https://registry.npmjs.org/

      - name: Build paired artifacts and run local release drill
        if: ${{ env.STATE != 'fully-published' }}
        run: bash dsh-mobile-app/tools/package-release.sh --drill

      # m8：发布前必须显式断言 tag 的 BUILD 与打包产物一致（pubspec build ↔ manifest.app.version
      # ↔ carrier 记录/内嵌清单），避免 build 写错却发布出可安装但不可对齐的产物。
      - name: Assert BUILD matches packaged manifest and carrier
        if: ${{ env.STATE != 'fully-published' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/release-gate.mjs verify-package \
            --root . \
            --plugin-version "$PLUGIN_VERSION" \
            --carrier-version "$CARRIER_VERSION" \
            --build "$BUILD"

      - name: Record release intent (submitted) in release-meta
        if: ${{ env.STATE != 'fully-published' }}
        shell: bash
        env:
          RELEASE_META_TOKEN: ${{ secrets.RELEASE_META_TOKEN || github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-meta-helpers.sh"
          release_meta_checkout
          carrier_file="dsh-mobile-app/dist/$(node -p "require('./dsh-mobile-app/dist/app-carrier.json').file")"
          test -s "$carrier_file"
          integrity="sha512-$(node -e 'const fs=require("fs"),c=require("crypto");process.stdout.write(c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$carrier_file")"
          # 在提交任何 npm publish 之前写入发布意图；之后无法确认结果时才能区分
          # “从未提交”与“提交后结果未知”。
          node tools/release-gate.mjs record-intent \
            --policy "$RELEASE_META_WT/build-policy.json" \
            --tag "$TAG" \
            --build "$BUILD" \
            --integrity "$integrity" \
            --resume
          release_meta_push "intent-submitted"

      - name: Publish carrier
        if: ${{ env.STATE != 'fully-published' }}
        shell: bash
        env:
          RELEASE_META_TOKEN: ${{ secrets.RELEASE_META_TOKEN || github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-meta-helpers.sh"
          if [[ "${CARRIER_ALREADY_PUBLISHED:-0}" == "1" ]]; then
            echo "Carrier $CARRIER_VERSION already published; skip republish (identity is verified later)."
            exit 0
          fi
          carrier_file="dsh-mobile-app/dist/$(node -p "require('./dsh-mobile-app/dist/app-carrier.json').file")"
          test -s "$carrier_file"
          publish_log="$RUNNER_TEMP/npm-publish-carrier.log"
          set +e
          npm publish "$carrier_file" \
            --tag "$CARRIER_PUBLISH_TAG" --access public \
            --registry "$REGISTRY" \
            --@marktrue:registry="$REGISTRY" > "$publish_log" 2>&1
          publish_status=$?
          set -e
          if [[ "$publish_status" -ne 0 ]]; then
            code="$(sed -n 's/^npm error code //p' "$publish_log" | head -1)"
            case "$code" in
              E401|E402|E403|E404|E413|E422|EOTP|ENEEDAUTH)
                echo "::error::Carrier publish rejected (npm code=${code}); no publish request was accepted."
                exit "$publish_status"
                ;;
              E409)
                echo '::warning::npm reports a staged/conflicting carrier version; polling visibility without republishing.'
                ;;
              *)
                echo "::error::release-visibility-unknown: carrier publish result unknown (npm code=${code:-unknown}); see runner-local npm log."
                release_meta_mark unknown "carrier publish unknown (code=${code:-unknown})" || true
                exit "$publish_status"
                ;;
            esac
          fi

          # npm can stage/process a successful publish. Poll; never retry the PUT.
          for attempt in $(seq 1 90); do
            if npm view "$PACKAGE_NAME@$CARRIER_VERSION" version --json --prefer-online \
              --registry "$REGISTRY" --@marktrue:registry="$REGISTRY" >/dev/null 2>&1; then
              echo "Carrier $CARRIER_VERSION is visible on npmjs (attempt $attempt)."
              exit 0
            fi
            sleep 10
          done
          echo '::error::release-visibility-unknown: Carrier is not visible after 15 minutes; recorded as unknown, manual recovery required (do not republish/delete tag).'
          release_meta_mark unknown "carrier visibility timeout" || true
          exit 1

      - name: Publish plugin
        if: ${{ env.STATE != 'fully-published' }}
        shell: bash
        env:
          RELEASE_META_TOKEN: ${{ secrets.RELEASE_META_TOKEN || github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-meta-helpers.sh"
          if [[ "${PLUGIN_ALREADY_PUBLISHED:-0}" == "1" ]]; then
            echo "Plugin $PLUGIN_VERSION already published; skip republish (identity is verified later)."
            exit 0
          fi
          plugin_file="dsh-mobile-app/dist/dsh-mobile-remote-v${PLUGIN_VERSION}.tgz"
          test -s "$plugin_file"
          publish_log="$RUNNER_TEMP/npm-publish-plugin.log"
          set +e
          npm publish "$plugin_file" \
            --tag "$PLUGIN_PUBLISH_TAG" --access public \
            --registry "$REGISTRY" \
            --@marktrue:registry="$REGISTRY" > "$publish_log" 2>&1
          publish_status=$?
          set -e
          if [[ "$publish_status" -ne 0 ]]; then
            code="$(sed -n 's/^npm error code //p' "$publish_log" | head -1)"
            case "$code" in
              E401|E402|E403|E404|E413|E422|EOTP|ENEEDAUTH)
                echo "::error::Plugin publish rejected (npm code=${code}); no publish request was accepted."
                exit "$publish_status"
                ;;
              E409)
                echo '::warning::npm reports a staged/conflicting plugin version; polling visibility without republishing.'
                ;;
              *)
                echo "::error::release-visibility-unknown: plugin publish result unknown (npm code=${code:-unknown}); see runner-local npm log."
                release_meta_mark unknown "plugin publish unknown (code=${code:-unknown})" || true
                exit "$publish_status"
                ;;
            esac
          fi

          for attempt in $(seq 1 90); do
            if npm view "$PACKAGE_NAME@$PLUGIN_VERSION" version --json --prefer-online \
              --registry "$REGISTRY" --@marktrue:registry="$REGISTRY" >/dev/null 2>&1; then
              echo "Plugin $PLUGIN_VERSION is visible on npmjs (attempt $attempt)."
              exit 0
            fi
            sleep 10
          done
          echo '::error::release-visibility-unknown: Plugin is not visible after 15 minutes; recorded as unknown, manual recovery required (do not republish/delete tag).'
          release_meta_mark unknown "plugin visibility timeout" || true
          exit 1

      - name: Set and verify channel / app / latest dist-tags
        if: ${{ env.STATE != 'fully-published' }}
        shell: bash
        run: |
          set -euo pipefail
          # 通道：alpha→alpha、rc→rc、stable→latest。stable 只有决策为 move 时才移动 latest；
          # 旧 stable 发布用 release-staging 发布，避免 `npm publish --tag latest` 无条件回退。
          if [[ "$TAG_KIND" == "stable" ]]; then
            if [[ "$LATEST_DECISION" == "move" ]]; then
              npm dist-tag add "$PACKAGE_NAME@$PLUGIN_VERSION" latest \
                --registry "$REGISTRY" --@marktrue:registry="$REGISTRY"
            else
              echo "latest dist-tag stays at newer/equal version: ${LATEST_BEFORE:-<unset>}"
            fi
          else
            # 设计稿 §5.2.7 反回退：候选插件版本必须与当前 channel 比较，只有候选更新才移动。
            case "${CHANNEL_DECISION:-move}" in
              move)
                npm dist-tag add "$PACKAGE_NAME@$PLUGIN_VERSION" "$PLUGIN_TAG" \
                  --registry "$REGISTRY" --@marktrue:registry="$REGISTRY"
                ;;
              keep)
                echo "channel $PLUGIN_TAG already at candidate ${PLUGIN_VERSION}; no channel move needed"
                ;;
              staging)
                echo "::warning::channel $PLUGIN_TAG=${CHANNEL_CURRENT:-<unset>} is newer than candidate ${PLUGIN_VERSION}; plugin stays on staging tag ${PLUGIN_STAGING_TAG} and the channel is NOT moved (anti-rollback)."
                ;;
              *)
                echo "::error::channel-decision-invalid: ${CHANNEL_DECISION}"
                exit 1
                ;;
            esac
            # 预发布永不移动 latest；这里只记录，不改变指针。
            echo "prerelease never moves latest; latest=${LATEST_BEFORE:-<unset>} (unchanged)"
          fi

          # app：先比较后移动；候选不大于当前时只在 staging tag 发布，app 保持原值。
          if [[ "$APP_DECISION" == "move" ]]; then
            npm dist-tag add "$PACKAGE_NAME@$CARRIER_VERSION" app \
              --registry "$REGISTRY" --@marktrue:registry="$REGISTRY"
          else
            echo "app dist-tag stays at newer/equal carrier: ${APP_CURRENT:-<unset>}"
          fi

          # 清理临时 staging tag（失败只告警，不影响精确版本解析）。
          npm dist-tag rm "$PACKAGE_NAME" app-staging >/dev/null 2>&1 || true
          npm dist-tag rm "$PACKAGE_NAME" release-staging >/dev/null 2>&1 || true
          npm dist-tag rm "$PACKAGE_NAME" "$PLUGIN_STAGING_TAG" >/dev/null 2>&1 || true

          verified=0
          for attempt in $(seq 1 24); do
            if node tools/release-gate.mjs verify-tags \
              --root . \
              --registry "$REGISTRY" \
              --state "$STATE" \
              --plugin-tag "$PLUGIN_TAG" \
              --plugin-version "$PLUGIN_VERSION" \
              --carrier-version "$CARRIER_VERSION" \
              --app-decision "$APP_DECISION" \
              --app-before "${APP_CURRENT:-}" \
              --latest-before "${LATEST_BEFORE:-}" \
              --latest-decision "$LATEST_DECISION" \
              --channel-decision "${CHANNEL_DECISION:-move}" \
              --channel-before "${CHANNEL_CURRENT:-}"; then
              verified=1
              break
            fi
            echo "dist-tags not converged yet (attempt $attempt); retrying in 5s..."
            sleep 5
          done
          if [[ "$verified" != "1" ]]; then
            echo '::error::dist-tag-verification-failed: dist-tags did not converge; release intent remains submitted (manual recovery).'
            exit 1
          fi

      - name: Verify published tarball integrity
        if: ${{ env.STATE != 'fully-published' }}
        shell: bash
        run: |
          set -euo pipefail
          plugin_file="dsh-mobile-app/dist/dsh-mobile-remote-v${PLUGIN_VERSION}.tgz"
          carrier_file="dsh-mobile-app/dist/$(node -p "require('./dsh-mobile-app/dist/app-carrier.json').file")"
          for item in "${PLUGIN_VERSION}:$plugin_file" "${CARRIER_VERSION}:$carrier_file"; do
            version="${item%%:*}"
            file="${item#*:}"
            local_integrity="sha512-$(node -e 'const fs=require("fs"),c=require("crypto");process.stdout.write(c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$file")"
            remote_integrity="$(npm view "$PACKAGE_NAME@$version" dist.integrity --json --prefer-online \
              --registry "$REGISTRY" --@marktrue:registry="$REGISTRY" | jq -r '.')"
            if [[ "$local_integrity" != "$remote_integrity" ]]; then
              already=0
              [[ "$version" == "$PLUGIN_VERSION" && "${PLUGIN_ALREADY_PUBLISHED:-0}" == "1" ]] && already=1
              [[ "$version" == "$CARRIER_VERSION" && "${CARRIER_ALREADY_PUBLISHED:-0}" == "1" ]] && already=1
              if [[ "$already" == "0" ]]; then
                echo "::error::Integrity mismatch for $version"
                exit 1
              fi
              echo "::warning::$version was published by an earlier CI build; byte difference is expected, checking package identity metadata instead."
            fi
          done

          # 对已发布版本核对轻量身份元数据（本地 dist 清单一致）。
          npm view "$PACKAGE_NAME@$CARRIER_VERSION" appVersion pluginContentSha256 --json --prefer-online \
            --registry "$REGISTRY" --@marktrue:registry="$REGISTRY" > "$RUNNER_TEMP/carrier-meta.json"
          node -e '
            const fs = require("fs");
            const carrier = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const manifest = JSON.parse(fs.readFileSync("dsh-mobile-app/dist/manifest.json", "utf8"));
            if (carrier.appVersion !== manifest.app.version) {
              console.error(`carrier appVersion mismatch: ${carrier.appVersion} != ${manifest.app.version}`); process.exit(1);
            }
            if (carrier.pluginContentSha256 !== manifest.plugin.contentSha256) {
              console.error(`carrier pluginContentSha256 mismatch: ${carrier.pluginContentSha256} != ${manifest.plugin.contentSha256}`);
              process.exit(1);
            }
            console.log("Published carrier identity metadata matches local dist manifest.");
          ' "$RUNNER_TEMP/carrier-meta.json"

      - name: Mark release intent published
        if: ${{ env.STATE != 'fully-published' }}
        shell: bash
        env:
          RELEASE_META_TOKEN: ${{ secrets.RELEASE_META_TOKEN || github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-meta-helpers.sh"
          release_meta_checkout
          # 意图里记录**registry 实际可见**的 carrier integrity（不是本地重建字节）：
          # 重跑/部分恢复时本地构建字节可能与首次 CI 不同，published 意图必须以
          # registry 的 dist.integrity 为准确认身份。
          remote_integrity="$(npm view "$PACKAGE_NAME@$CARRIER_VERSION" dist.integrity --json --prefer-online \
            --registry "$REGISTRY" --@marktrue:registry="$REGISTRY" | jq -r '.')"
          if [[ -z "$remote_integrity" || "$remote_integrity" == "null" ]]; then
            echo '::error::release-intent-integrity-missing: 无法读取已发布 carrier 的 dist.integrity'
            exit 1
          fi
          node tools/release-gate.mjs mark-intent \
            --policy "$RELEASE_META_WT/build-policy.json" \
            --tag "$TAG" --status published --note "dist-tags verified" \
            --integrity "$remote_integrity"
          release_meta_push "intent-published"
          echo "Release intent for $TAG marked published (registry integrity)."
